alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602905
    runbook: docs/alerts.md#highlatencyp95
  - name: ElevatedErrorRate
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602905
    runbook: docs/alerts.md#elevatederrorrate
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602905
    runbook: docs/alerts.md#lowretrievalsuccess
